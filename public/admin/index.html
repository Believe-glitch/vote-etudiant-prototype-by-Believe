<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06274a">
  <meta name="robots" content="noindex">
  <title>Espace officiels – URKIMeVote</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/icone-180.png">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/admin/connexion.js"></script>
</head>
<body>
  <header class="entete">
    <div class="entete-contenu">
      <a class="logo" href="/" aria-label="URKIMeVote, retour à l’accueil">
        <span class="logo-mot" aria-hidden="true">URKIM<span class="logo-accent">e</span><svg class="logo-tel" viewBox="0 -12 70 116" aria-hidden="true"><rect class="tel-trait" x="6" y="4" width="52" height="96" rx="13"/><line class="tel-trait tel-fin" x1="26" y1="15" x2="38" y2="15"/><circle class="tel-plein" cx="32" cy="87" r="3.2"/><path class="tel-halo" d="M20 39 L31 62 L62 -6"/><path class="tel-v" d="M20 39 L31 62 L62 -6"/></svg>ote</span>
        <span class="logo-suffixe">Officiels</span>
      </a>
    </div>
  </header>

  <main>
    <section class="carte connexion-officiels" aria-labelledby="titre-connexion">
      <img class="connexion-ecusson" src="/images/ecusson-urkim-360.webp" alt="Écusson de l’Université Révérend Kim" width="323" height="360">
      <h1 id="titre-connexion">Espace officiels</h1>
      <p class="texte-doux">Réservé au superviseur, aux distributeurs de codes et aux observateurs.</p>
      <form id="formulaire-connexion" novalidate>
        <div class="champ">
          <label for="identifiant">Identifiant</label>
          <input id="identifiant" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="champ">
          <label for="mot-de-passe">Mot de passe</label>
          <input id="mot-de-passe" type="password" autocomplete="current-password" required>
        </div>
        <div id="message"></div>
        <button class="bouton bouton-accent" type="submit">Se connecter</button>
      </form>
    </section>
  </main>
</body>
</html>
